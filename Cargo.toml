[workspace]
resolver = "3"
members = ["pipewire", "spa", "spa-macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
bytes = "1.12"
futures = "0.3"
indexmap = "2.14"
thiserror = "2"
tokio = "1.53"
tracing = "0.1"
tracing-subscriber = "0.3"
